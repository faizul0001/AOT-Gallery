<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOT Portal - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <!-- ল্যাঙ্গুয়েজ সুইচার বাটন -->
    <div class="lang-switcher">
        <button onclick="switchLanguage('en')" id="btn-en" class="active">English</button>
        <button onclick="switchLanguage('bn')" id="btn-bn">বাংলা</button>
    </div>

    <div class="login-container">
        <!-- ইংরেজি কন্টেন্ট -->
        <div class="lang-en">
            <h1 class="login-title">ATTACK ON TITAN</h1>
            <p class="login-subtitle">Access the Classified Military Database</p>
            
            <!-- গুগল লগইন বাটন (SVG লোগোসহ) -->
            <a href="gallery.html" class="google-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="22px" height="22px">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.5 24c0-1.55-.15-3.24-.47-4.77H24v9.03h12.75c-.55 2.97-2.22 5.5-4.77 7.21l7.4 5.73c4.32-4 7.12-9.88 7.12-17.2z"/>
                    <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.4-5.73c-2.11 1.42-4.81 2.3-8.49 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Continue with Google</span>
            </a>
        </div>

        <!-- বাংলা কন্টেন্ট -->
        <div class="lang-bn" style="display: none;">
            <h1 class="login-title">ATTACK ON TITAN</h1>
            <p class="login-subtitle">সর্বাধিক গোপনীয় ডেটাবেজে প্রবেশ করুন</p>
            
            <!-- গুগল লগইন বাটন (বাংলা) -->
            <a href="gallery.html" class="google-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="22px" height="22px">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.5 24c0-1.55-.15-3.24-.47-4.77H24v9.03h12.75c-.55 2.97-2.22 5.5-4.77 7.21l7.4 5.73c4.32-4 7.12-9.88 7.12-17.2z"/>
                    <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.4-5.73c-2.11 1.42-4.81 2.3-8.49 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>গুগল দিয়ে এগিয়ে যান</span>
            </a>
        </div>
    </div>

    <!-- ভাষা পরিবর্তনের জাভাস্ক্রিপ্ট কোড -->
    <script>
        function switchLanguage(lang) {
            const enElements = document.querySelectorAll('.lang-en');
            const bnElements = document.querySelectorAll('.lang-bn');
            const btnEn = document.getElementById('btn-en');
            const btnBn = document.getElementById('btn-bn');

            if (lang === 'en') {
                enElements.forEach(el => el.style.display = 'block');
                bnElements.forEach(el => el.style.display = 'none');
                btnEn.classList.add('active');
                btnBn.classList.remove('active');
            } else {
                enElements.forEach(el => el.style.display = 'none');
                bnElements.forEach(el => el.style.display = 'block');
                btnEn.classList.remove('active');
                btnBn.classList.add('active');
            }
        }
    </script>
</body>
</html>
